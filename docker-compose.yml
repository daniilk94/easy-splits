services:
  postgres:
    image: postgres:16-alpine
    container_name: easy_splits_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: easysplits_user
      POSTGRES_PASSWORD: easysplits_password
      POSTGRES_DB: easysplits_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: